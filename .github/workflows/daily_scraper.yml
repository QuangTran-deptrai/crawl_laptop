name: Daily Laptop Data Scraper (Parallel)

on:
  workflow_dispatch:


env:
  PYTHONUNBUFFERED: "1" # Ép Python in log ra ngay lập tức để không bị tưởng là treo
  PYTHONIOENCODING: "utf-8" # Fix lỗi in tiếng Việt (Unicode) trên Windows
  TZ: "Asia/Ho_Chi_Minh" # Set múi giờ Việt Nam cho máy chủ ảo Ubuntu

jobs:
  prepare_links:
    name: Chuẩn bị Link ${{ matrix.script_info.name }}
    runs-on: ${{ matrix.script_info.os }}
    strategy:
      fail-fast: false
      matrix:
        script_info: 
          - { name: tgdd_scrape.py, os: self-hosted, prefix: tgdd, sitemap_only: true }
          - { name: phongvu_scrape.py, os: self-hosted, prefix: phongvu, sitemap_only: false }
          - { name: gearvn_scrape.py, os: ubuntu-latest, prefix: gearvn, sitemap_only: true }
          - { name: fptshop_scrape.py, os: self-hosted, prefix: fpt, sitemap_only: false }
          - { name: cellphones_requests.py, os: ubuntu-latest, prefix: cellphones, sitemap_only: true }
          - { name: xgear_requests.py, os: ubuntu-latest, prefix: xgear, sitemap_only: true }

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11 (Chỉ Ubuntu)
        if: matrix.script_info.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cài đặt Playwright & Patchright Chromium
        if: ${{ matrix.script_info.sitemap_only == false }}
        run: |
          playwright install chromium
          patchright install chromium

      - name: Cài đặt màn hình ảo (Xvfb) (Chỉ Ubuntu, không cần cho sitemap)
        if: matrix.script_info.os == 'ubuntu-latest' && matrix.script_info.sitemap_only == false
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Quét Link bằng Sitemap (không cần browser)
        if: ${{ matrix.script_info.sitemap_only == true }}
        continue-on-error: true
        run: python ${{ matrix.script_info.name }} --get-links-only

      - name: Quét toàn bộ Link (Ubuntu, cần browser)
        if: matrix.script_info.os == 'ubuntu-latest' && matrix.script_info.sitemap_only == false
        continue-on-error: true
        run: xvfb-run python ${{ matrix.script_info.name }} --get-links-only

      - name: Quét toàn bộ Link (Windows Self-hosted)
        if: matrix.script_info.os == 'self-hosted'
        continue-on-error: true
        run: python ${{ matrix.script_info.name }} --get-links-only

      - name: Tải file danh sách link lên bộ nhớ tạm
        uses: actions/upload-artifact@v4
        with:
          name: links-${{ matrix.script_info.prefix }}
          path: "*_links.txt"
          if-no-files-found: ignore
          retention-days: 1

  scrape:
    name: Cào dữ liệu ${{ matrix.script_info.name }}
    needs: prepare_links
    runs-on: ${{ matrix.script_info.os }}
    strategy:
      fail-fast: false # Đừng huỷ các tiến trình khác nếu có 1 web bị lỗi
      matrix:
        script_info: 
          - { name: tgdd_scrape.py, os: self-hosted, prefix: tgdd }
          - { name: phongvu_scrape.py, os: self-hosted, prefix: phongvu }
          - { name: gearvn_scrape.py, os: ubuntu-latest, prefix: gearvn }
          - { name: fptshop_scrape.py, os: self-hosted, prefix: fpt }
          - { name: cellphones_requests.py, os: ubuntu-latest, prefix: cellphones }
          - { name: xgear_requests.py, os: ubuntu-latest, prefix: xgear }
        chunk: [1, 2, 3, 4, 5]

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        
      - name: Tải danh sách link từ đám mây
        uses: actions/download-artifact@v4
        with:
          name: links-${{ matrix.script_info.prefix }}
        continue-on-error: true


      - name: Cài đặt Python 3.11 (Chỉ Ubuntu)
        if: matrix.script_info.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cài đặt Playwright & Patchright Chromium
        run: |
          playwright install chromium
          patchright install chromium

      - name: Cài đặt màn hình ảo (Xvfb) (Chỉ Ubuntu)
        if: matrix.script_info.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Chạy script cào dữ liệu (Ubuntu)
        if: matrix.script_info.os == 'ubuntu-latest'
        continue-on-error: true # Cho phép lỗi (ví dụ không tìm thấy element) để không sập workflow
        run: xvfb-run python ${{ matrix.script_info.name }} --chunk ${{ matrix.chunk }} --total-chunks 5

      - name: Chạy script cào dữ liệu (Windows Self-hosted)
        if: matrix.script_info.os == 'self-hosted'
        continue-on-error: true
        run: python ${{ matrix.script_info.name }} --chunk ${{ matrix.chunk }} --total-chunks 5

      - name: Tải file Excel và trạng thái lên bộ nhớ tạm
        uses: actions/upload-artifact@v4
        with:
          name: excel-data-${{ matrix.script_info.name }}-chunk-${{ matrix.chunk }}
          path: |
            *.xlsx
            *_pending*.txt
          if-no-files-found: ignore
          retention-days: 1 # Chỉ lưu 1 ngày để dọn rác

  sync:
    name: Đồng bộ dữ liệu & Báo cáo
    needs: scrape # Đảm bảo job này chỉ chạy khi 5 máy ảo trên kia đã chạy xong
    runs-on: self-hosted # ĐỔI SANG SELF-HOSTED ĐỂ KẾT NỐI POSTGRESQL
    permissions:
      contents: write # Cấp quyền cho lệnh push lên Github
      actions: write # Cấp quyền kích hoạt lại workflow

    steps:
      - name: Bổ sung Git vào PATH (Windows)
        run: python -c "import os, glob; paths = [r'C:\Program Files\Git\cmd', r'C:\Users\PSD\actions-runner\externals\git\cmd'] + glob.glob(r'C:\Users\*\actions-runner\externals\git\cmd'); [open(os.environ['GITHUB_PATH'], 'a').write(p + '\n') for p in paths if os.path.exists(p)]"
        continue-on-error: true

      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xóa pending cũ nội bộ để cập nhật trạng thái mới nhất
        run: python -c "import glob, os; [os.remove(f) for f in glob.glob('*_pending*.txt')]"

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tải các file Excel từ bộ nhớ tạm về máy này
        uses: actions/download-artifact@v4
        with:
          pattern: excel-data-*
          merge-multiple: true # Gộp chung tất cả file xlsx vào cùng 1 thư mục hiện tại

      - name: Đồng bộ dữ liệu, nạp Database và Báo cáo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: python post_sync.py
